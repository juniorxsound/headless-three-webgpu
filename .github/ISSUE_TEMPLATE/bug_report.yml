name: Bug Report
description: File a reproducible bug or regression.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: How do you trigger this bug? Please walk us through it step by step.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code
      description: Please provide minimal code to reproduce the issue.
      value: |
        ```ts
        import { createRenderer } from '@rendergl/core';

        // code goes here
        ```
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: What version of the package are you using?
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      multiple: true
      options:
        - "@rendergl/core"
        - "@rendergl/helpers"
        - "rgl (CLI)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      multiple: true
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: What version of Node.js are you using?
      placeholder: "24.0.0"
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU (if applicable)
      description: What GPU are you using?
      placeholder: "Apple M1, NVIDIA RTX 3080, etc."
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context about the problem here (logs, screenshots, etc.).
    validations:
      required: false
